##
title = "My Reviews"
url = "/shop/account/reviews"
layout = "default"

[session]
security = "user"
redirect = "account/login"
==
{% if not shopConfig %}
    {% do abort(404) %}
{% endif %}

<section class="relative py-12 md:py-16" data-shop-page="reviews">
    <div class="container">
        {% partial 'shop/account-nav' %}
        <h1 class="mb-6 text-2xl font-medium">{{ 'My Reviews'|_ }}</h1>
        <div class="space-y-4" data-shop-reviews>
            {% partial 'shop/loading' %}
        </div>
    </div>
</section>
