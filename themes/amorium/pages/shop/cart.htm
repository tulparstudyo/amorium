##
title = "Cart"
url = "/shop/cart"
layout = "default"
==
{% if not shopConfig %}
    {% do abort(404) %}
{% endif %}

<section class="relative py-12 md:py-16" data-shop-page="cart">
    <div class="container">
        <h1 class="mb-8 text-3xl font-medium">{{ 'Cart'|_ }}</h1>
        <div data-shop-cart>
            {% partial 'shop/loading' %}
        </div>
    </div>
</section>
