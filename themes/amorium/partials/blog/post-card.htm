{% set postUrl = 'blog-post'|page({ slug: post.slug }) %}

<article class="relative overflow-hidden rounded-md shadow-sm shadow-line dark:shadow-night-line">
    {% if post.featured_image %}
        <a href="{{ postUrl }}">
            <img src="{{ post.featured_image|media }}" alt="{{ post.title }}" class="aspect-video w-full object-cover" loading="lazy" />
        </a>
    {% endif %}

    <div class="p-6">
        {% if post.published_at %}
            <time datetime="{{ post.published_at.toAtomString() }}" class="mb-2 block text-sm text-muted">{{ post.published_at.translatedFormat('j F Y') }}</time>
        {% endif %}

        <a href="{{ postUrl }}" class="text-lg font-medium transition-all duration-500 hover:text-primary dark:text-night-body dark:hover:text-primary">{{ post.title }}</a>

        {% if post.excerpt %}
            <p class="mt-3 text-muted">{{ post.excerpt }}</p>
        {% endif %}

        <div class="mt-5">
            <a href="{{ postUrl }}" class="relative inline-block text-center align-middle tracking-wide ease-in-out after:absolute after:start-0 after:end-0 after:bottom-0 after:h-px after:w-0 after:bg-primary after:transition-all after:duration-500 after:content-[''] hover:text-primary hover:after:end-auto hover:after:w-full dark:text-night-body dark:hover:text-primary">{{ 'Read More'|_ }} <i class="ri-arrow-right-line"></i></a>
        </div>
    </div>
</article>
